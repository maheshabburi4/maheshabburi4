<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="terminal-title terminal-desc">
  <title id="terminal-title">Mahesh Abburi — quantitative research, development and systematic trading</title>
  <desc id="terminal-desc">Trading-terminal-inspired profile. Assistant Vice President at Edelweiss Global Markets, researching Indian and US index and stock derivatives. Co-managing a 42-million-dollar portfolio in a two-person team, with an execution engine for more than 40 strategies. The chart is an illustrative synthetic spread.</desc>
